<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant TAP</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#12292f;--mute:#5a7077;--line:#d3dde0;--acc:#0b6e7a;--acc2:#e8f3f4;--warn:#a85a00;--warnbg:#fdf1e0;--ok:#1d6b3a;--okbg:#e5f4ea;--bad:#a3262a;--badbg:#fbe9e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1d;--card:#15262a;--ink:#e3eef0;--mute:#93aab0;--line:#2b4248;--acc:#4fc3d1;--acc2:#183a40;--warn:#f0b36a;--warnbg:#3a2a12;--ok:#7fd49b;--okbg:#14301f;--bad:#f09a9d;--badbg:#3b1b1c}}
:root[data-theme="dark"]{--bg:#0e1a1d;--card:#15262a;--ink:#e3eef0;--mute:#93aab0;--line:#2b4248;--acc:#4fc3d1;--acc2:#183a40;--warn:#f0b36a;--warnbg:#3a2a12;--ok:#7fd49b;--okbg:#14301f;--bad:#f09a9d;--badbg:#3b1b1c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,"Noto Naskh Arabic",sans-serif}
header{padding:28px 18px 18px;max-width:900px;margin:0 auto}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--mute);max-width:60ch}
main{max-width:900px;margin:0 auto;padding:0 14px 40px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-size:1.1rem;margin:0 0 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small{color:var(--mute);font-weight:400;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center;color:var(--ink);cursor:pointer;font-size:.95rem}
.seg input{display:none}
.seg input:checked+span{font-weight:700;color:var(--acc)}
.seg label:has(input:checked){background:var(--acc2);border-color:var(--acc)}
.chk{display:grid;gap:6px}
.chk label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem;margin:0}
.chk input{width:auto}
.imc{font-weight:700;color:var(--acc)}
button{font:inherit;padding:11px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
[data-theme="dark"] button.p,:root:not([data-theme="light"]) button.p{color:#06262b}
.lang{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.lang button{padding:6px 12px;background:transparent;color:var(--acc)}.lang button[aria-pressed=true]{background:var(--acc);color:#fff}
button.s{background:transparent;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{border-radius:6px;padding:10px 12px;margin:8px 0;font-size:.93rem;border-left:4px solid}
.note.ok{background:var(--okbg);border-color:var(--ok)}
.note.warn{background:var(--warnbg);border-color:var(--warn)}
.note.bad{background:var(--badbg);border-color:var(--bad)}
.note.info{background:var(--acc2);border-color:var(--acc)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:620px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--mute);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:1rem;margin-bottom:4px}
.stat span{display:block;font-size:.9rem;color:var(--mute)}
canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#000;cursor:crosshair}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}input[type=range]{padding:0}.foot{color:var(--mute);font-size:.82rem;max-width:900px;margin:0 auto;padding:0 18px 30px}
ul{margin:6px 0;padding-left:20px}
</style>
</head>
<body>
<header>
<h1 data-i="title"></h1>
<p data-i="sub"></p>
<div class="lang" id="lang">
<button data-l="fr">Français</button><button data-l="en">English</button><button data-l="de">Deutsch</button><button data-l="ar">العربية</button>
</div>
</header>
<main>
<section>
<h2 data-i="s1"></h2>
<div class="grid">
<div><label for="code" data-i="code"></label><input id="code" placeholder="P-014"></div>
<div><label for="age" data-i="age"></label><input id="age" type="number" min="0" max="120" inputmode="numeric"></div>
<div><label for="sexe" data-i="sex"></label><select id="sexe"><option>F</option><option>M</option></select></div>
<div><label for="poids" data-i="w"></label><input id="poids" type="number" min="1" max="300" inputmode="decimal"></div>
<div><label for="taille" data-i="h"></label><input id="taille" type="number" min="30" max="250" inputmode="numeric"></div>
<div><label data-i="imc"></label><div class="imc" id="imc" style="padding:10px 0" dir="ltr">–</div></div>
</div>
</section>
<section>
<h2 data-i="s2"></h2>
<label data-i="type"></label>
<div class="seg">
<label><input type="radio" name="ctx" value="U"><span data-i="urg"></span></label>
<label><input type="radio" name="ctx" value="S" checked><span data-i="suivi"></span></label>
</div>
<div class="grid" style="margin-top:12px">
<div><label for="patho" data-i="patho"></label><select id="patho"></select></div>
<div><label for="contraste" data-i="contrast"></label><select id="contraste"></select></div>
<div><label for="egfr" data-i="g_egfr"></label><input id="egfr" type="number" inputmode="decimal"></div>
<div><label for="conc" data-i="g_conc"></label><select id="conc"><option value="300">300 mgI/mL</option><option value="350" selected>350 mgI/mL</option></select></div>
</div>
</section>
<section>
<h2 data-i="s3"></h2>
<div class="chk" id="pre">
<label><input type="checkbox"><span data-i="c1"></span></label>
<label><input type="checkbox"><span data-i="c2"></span></label>
<label><input type="checkbox"><span data-i="c3"></span></label>
<label><input type="checkbox"><span data-i="c4"></span></label>
<label><input type="checkbox"><span data-i="c5"></span></label>
<label><input type="checkbox"><span data-i="c6"></span></label>
</div>
</section>
<section>
<h2 data-i="s4"></h2>
<div class="grid" dir="auto">
<div><label for="kv">kV</label><input id="kv" type="number" inputmode="numeric"></div>
<div><label for="mas">mAs</label><input id="mas" type="number" inputmode="numeric"></div>
<div><label for="ep" data-i="ep"></label><input id="ep" type="number" step="0.1" inputmode="decimal"></div>
<div><label for="pitch">Pitch</label><input id="pitch" type="number" step="0.01" inputmode="decimal"></div>
<div><label for="ctdi">CTDIvol (mGy)</label><input id="ctdi" type="number" step="0.1" inputmode="decimal"></div>
<div><label for="dlp">DLP (mGy·cm)</label><input id="dlp" type="number" inputmode="numeric"></div>
<div><label for="duree" data-i="dur"></label><input id="duree" type="number" step="0.5" inputmode="decimal"></div>
<div><label for="ref" data-i="ref"></label><input id="ref" type="number" step="0.1" inputmode="decimal"></div>
</div>
</section>
<section>
<h2 data-i="s5"></h2>
<p style="margin:0 0 8px;color:var(--mute);font-size:.9rem" data-i="qhint"></p>
<div class="chk" id="qi">
<label><input type="checkbox" value="mvt"><span data-i="q1"></span></label>
<label><input type="checkbox" value="bruit"><span data-i="q2"></span></label>
<label><input type="checkbox" value="art"><span data-i="q3"></span></label>
<label><input type="checkbox" value="cent"><span data-i="q4"></span></label>
<label><input type="checkbox" value="opac"><span data-i="q5"></span></label>
</div>
<div class="row">
<button class="p" id="go" data-i="go"></button>
<button class="s" id="save" data-i="save"></button>
<button class="s" id="theme" data-i="theme"></button>
</div>
</section>
<section id="sgs">
<h2 data-i="g_t"></h2>
<div class="row" style="margin:0 0 12px"><button class="p" id="sgGo" data-i="g_btn"></button></div>
<div id="sg" hidden></div>
</section>
<section id="imgs">
<h2 data-i="i_t"></h2>
<p style="margin:0 0 10px;color:var(--mute);font-size:.9rem" data-i="i_hint"></p>
<input type="file" id="ifile" accept="image/*">
<div id="ib" hidden>
<div class="grid" style="margin-top:12px">
<div><label data-i="i_lum"></label><input type="range" id="ilum" min="-60" max="60" value="0"></div>
<div><label data-i="i_con"></label><input type="range" id="icon" min="5" max="25" value="10"></div>
<div><label data-i="i_den"></label><input type="range" id="iden" min="0" max="3" value="0"></div>
<div><label data-i="i_sha"></label><input type="range" id="isha" min="0" max="20" value="0"></div>
</div>
<div class="two">
<div><label data-i="i_orig"></label><canvas id="cO"></canvas></div>
<div><label data-i="i_enh"></label><canvas id="cE"></canvas></div>
</div>
<div id="ist" class="note info"></div>
<div class="row"><button class="s" id="ireset" data-i="i_reset"></button></div>
</div>
</section>
<section id="out" hidden>
<h2 data-i="res"></h2>
<div id="res"></div>
</section>
<section>
<h2 data-i="s6"></h2>
<div id="stats" class="stats"></div>
<div class="tbl" style="margin-top:12px"><table>
<thead><tr id="thead"></tr></thead>
<tbody id="rows"></tbody></table></div>
<div class="row"><button class="s" id="clear" data-i="clear"></button></div>
</section>
</main>
<p class="foot" data-i="foot"></p>

let lang='fr',data=[];
try{data=JSON.parse(localStorage.getItem('tap_data')||'[]');lang=localStorage.getItem('tap_lang')||'fr'}catch(e){}
if(!L[lang])lang='fr';
data=data.filter(d=>d.ctx==='U'||d.ctx==='S');
const T=()=>L[lang];
function persist(){try{localStorage.setItem('tap_data',JSON.stringify(data))}catch(e){}}
function ctx(){return document.querySelector('input[name=ctx]:checked').value}
const ctxName=c=>c==='U'?T().urg:T().suivi;
function imc(){const p=num('poids'),t=num('taille');return p&&t?+(p/((t/100)**2)).toFixed(1):null}
['poids','taille'].forEach(i=>$(i).addEventListener('input',()=>{const v=imc();$('imc').textContent=v?v+' kg/m²':'–'}));

function setLang(l){
lang=l;try{localStorage.setItem('tap_lang',l)}catch(e){}
const t=T(),d=document.documentElement;
d.lang=l;d.dir=l==='ar'?'rtl':'ltr';
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);
const ps=$('patho'),pi=ps.selectedIndex<0?0:ps.selectedIndex;
ps.innerHTML=t.p.map((x,i)=>`<option value="${i}">${x}</option>`).join('');ps.selectedIndex=pi;
const cs=$('contraste'),ci=cs.selectedIndex<0?0:cs.selectedIndex;
cs.innerHTML=`<option value="1">${t.cw}</option><option value="0">${t.cwo}</option>`;cs.selectedIndex=ci;
$('thead').innerHTML=t.th.map(x=>`<th>${x}</th>`).join('');
document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
table();if(!$('out').hidden)render(false);if(!$('sg').hidden)suggest();if(G)enhance();
}

function analyse(){
const t=T(),m=t.m,n=[],add=(c,x)=>n.push([c,x]);
const age=num('age'),v=imc(),kv=num('kv'),mas=num('mas'),ep=num('ep'),pi=num('pitch'),ct=num('ctdi'),ref=num('ref'),du=num('duree');
const urg=ctx()==='U',pat=+$('patho').value;
if(v){if(v>=30)add('warn',m.obese(v));else if(v<18.5)add('info',m.thin(v));else add('ok',m.norm(v,v<25?t.cat.n:t.cat.o))}else add('info',m.noimc);
if(age!=null){if(age<18)add('bad',m.minor);else if(age<40)add('warn',m.young);else if(age>=75)add('info',m.old)}
add('info',urg?m.urg:m.fol);
if(pat===2)add('info',m.trauma);
if((pat===0||pat===1)&&$('contraste').value==='0')add('warn',m.onco);
if(kv&&v){if(v>=30&&kv<=100)add('warn',m.kvl(kv));if(v<20&&kv>=140)add('warn',m.kvh(kv))}
if(ep&&ep>5)add('warn',m.ep(ep));
if(pi&&pi>1.5)add('info',m.pi);
if(ct&&ref){const d=Math.round(Math.abs(ct-ref)/ref*100);if(ct>ref*1.2)add('bad',m.dh(ct,d));else if(ct<ref*.8)add('ok',m.dl(ct,d));else add('ok',m.dn(ct))}else if(ct)add('info',m.dr);
if(du){const s=data.filter(d=>d.ctx===ctx()&&d.duree);if(s.length){const a=s.reduce((x,d)=>x+d.duree,0)/s.length;add(du>a*1.3?'warn':'ok',m.du(du,a.toFixed(1),ctxName(ctx())))}}
document.querySelectorAll('#qi input:checked').forEach(i=>add('warn',m[i.value]));
const u=[...document.querySelectorAll('#pre input')].filter(i=>!i.checked).length;
if(u)add('warn',m.chk(u));
return n;
}
function render(scroll=true){
$('res').innerHTML=analyse().map(([c,x])=>`<div class="note ${c}">${x}</div>`).join('');
$('out').hidden=false;if(scroll)$('out').scrollIntoView({behavior:'smooth',block:'start'});
}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const f=(v,d)=>v==null?'–':v.toFixed(d);
function table(){
const t=T();
$('rows').innerHTML=data.map(d=>`<tr><td>${d.code}</td><td>${d.age??'–'}</td><td>${d.imc??'–'}</td><td>${ctxName(d.ctx)}</td><td>${t.p[d.patho]}</td><td>${d.kv??'–'}</td><td>${d.mas??'–'}</td><td>${d.ep??'–'}</td><td>${d.ctdi??'–'}</td><td>${d.dlp??'–'}</td><td>${d.duree??'–'}</td></tr>`).join('')||`<tr><td colspan="11" style="color:var(--mute)">${t.empty}</td></tr>`;
$('stats').innerHTML=['U','S'].map(c=>{const s=data.filter(d=>d.ctx===c),g=k=>mean(s.map(d=>d[k]).filter(x=>x!=null));
return `<div class="stat"><b>${ctxName(c)} (${s.length})</b><span>${t.mCt} : ${f(g('ctdi'),1)} mGy</span><span>${t.mDlp} : ${f(g('dlp'),0)} mGy·cm</span><span>${t.mDur} : ${f(g('duree'),1)} min</span><span>${t.mImc} : ${f(g('imc'),1)}</span></div>`}).join('');
}
const CFG={kv:[[22,100],[32,120],[999,140]],mas:[[22,'100–130'],[30,'130–170'],[35,'170–220'],[999,'220–300']],mgIkg:450,minV:60,maxV:140};
function suggest(){
const t=T(),m=t.gm,w=num('poids'),v=imc(),age=num('age'),g=num('egfr'),conc=+$('conc').value;
const pat=+$('patho').value,urg=ctx()==='U',wc=$('contraste').value==='1';
const note=(c,x)=>`<div class="note ${c}">${x}</div>`,card=(l,x)=>`<div class="stat"><span>${l}</span><b style="font-size:1.35rem" dir="ltr">${x}</b></div>`;
let h='';
if(age!=null&&age<18)h=note('bad',m.minor);
else if(!v||!w)h=note('warn',m.nod);
else{
const kv=CFG.kv.find(x=>v<x[0])[1],mas=CFG.mas.find(x=>v<x[0])[1];
let c=card('kV',kv)+card(t.g_mas,mas),n='';
if(!wc)n+=note('info',m.noc);
else if(g!=null&&g<30)n+=note('bad',m.lg);
else{
const vol=Math.min(CFG.maxV,Math.max(CFG.minV,Math.round(w*CFG.mgIkg/conc/5)*5));
c+=card(t.g_vol,vol+' mL')+card(t.g_flow,(urg&&pat===2?4:3)+' mL/s');
if(g==null)n+=note('warn',m.ng);else if(g<45)n+=note('warn',m.mg);
n+=note('ok',m.why(v,kv,w,CFG.mgIkg,conc));
}
c+=card(t.g_ep,urg?'3 mm':'2–3 mm');
if(wc)c+=card(t.g_ph,pat===2?m.p2:m.p1);
h=`<div class="stats">${c}</div>`+n;
}
$('sg').innerHTML=h+note('info',t.g_hint);$('sg').hidden=false;
}
$('sgGo').onclick=suggest;
let G=null,W=0,H=0,roi=null,tm=null;
function paint(c,a){const x=c.getContext('2d'),im=x.createImageData(W,H);for(let i=0;i<W*H;i++){const v=Math.max(0,Math.min(255,a[i]));im.data[4*i]=im.data[4*i+1]=im.data[4*i+2]=v;im.data[4*i+3]=255}x.putImageData(im,0,0);if(roi){x.strokeStyle='#ff0';x.lineWidth=2;x.strokeRect(roi.x,roi.y,30,30)}}
function conv(a,med){const o=new Float32Array(a.length),p=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){p.length=0;for(let dy=-1;dy<=1;dy++){const yy=Math.min(H-1,Math.max(0,y+dy));for(let dx=-1;dx<=1;dx++)p.push(a[yy*W+Math.min(W-1,Math.max(0,x+dx))])}if(med){p.sort((u,v)=>u-v);o[y*W+x]=p[4]}else o[y*W+x]=p.reduce((s,v)=>s+v,0)/9}return o}
function st(a){let s=0,q=0;for(let y=roi.y;y<roi.y+30;y++)for(let x=roi.x;x<roi.x+30;x++){const v=a[y*W+x];s+=v;q+=v*v}const m=s/900,sd=Math.sqrt(Math.max(0,q/900-m*m));return [sd,m/(sd||1)]}
function enhance(){
if(!G)return;let a=G;const n=+$('iden').value,s=+$('isha').value/10;
for(let i=0;i<n;i++)a=conv(a,true);
if(s>0){const b=conv(a,false);a=a.map((v,i)=>v+s*(v-b[i]))}
const c=+$('icon').value/10,l=+$('ilum').value;
paint($('cO'),G);paint($('cE'),a.map(v=>(v-128)*c+128+l));
if(roi){const p=st(G),q=st(a);$('ist').textContent=T().i_n(p[0].toFixed(1),q[0].toFixed(1),p[1].toFixed(1),q[1].toFixed(1))}else $('ist').textContent=T().i_tip;
}
function later(){clearTimeout(tm);tm=setTimeout(enhance,120)}
$('ifile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,768/im.width);W=Math.round(im.width*k);H=Math.round(im.height*k);const t=document.createElement('canvas');t.width=W;t.height=H;const x=t.getContext('2d');x.drawImage(im,0,0,W,H);const d=x.getImageData(0,0,W,H).data;G=new Float32Array(W*H);for(let i=0;i<W*H;i++)G[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];$('cO').width=$('cE').width=W;$('cO').height=$('cE').height=H;roi=null;$('ib').hidden=false;enhance()};im.src=r.result};r.readAsDataURL(f)};
['ilum','icon','iden','isha'].forEach(i=>$(i).oninput=later);
['cO','cE'].forEach(i=>$(i).onclick=e=>{const r=e.target.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;roi={x:Math.round(Math.max(0,Math.min(W-30,x-15))),y:Math.round(Math.max(0,Math.min(H-30,y-15)))};enhance()});
$('ireset').onclick=()=>{$('ilum').value=0;$('icon').value=10;$('iden').value=0;$('isha').value=0;roi=null;enhance()};
$('go').onclick=()=>render();
$('save').onclick=()=>{const code=$('code').value.trim();
if(!code){alert(T().needCode);$('code').focus();return}
data.push({code,age:num('age'),imc:imc(),ctx:ctx(),patho:+$('patho').value,kv:num('kv'),mas:num('mas'),ep:num('ep'),ctdi:num('ctdi'),dlp:num('dlp'),duree:num('duree')});
persist();table()};
$('clear').onclick=()=>{if(confirm(T().confirm)){data=[];persist();table()}};
$('theme').onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0e1a1d';r.setAttribute('data-theme',dark?'light':'dark')};
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.querySelectorAll('input[name=ctx]').forEach(r=>r.onchange=()=>{if(!$('out').hidden)render(false)});
setLang(lang);
</script>
</body>
